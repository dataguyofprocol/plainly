# The server (.next/standalone) ships via extraResources, outside the asar:
# native .node/dylib can't dlopen from a read-only archive, and server.js
# process.chdir()s into its own dir. The asar holds only the shell.
appId: app.plainly.Plainly
productName: Plainly
directories:
  output: dist
# mac build/icon.icon needs actool >= 26 (Xcode 26+). Its fallback icns is
# capped at 256px, so scripts/after-pack.cjs swaps in the full-res
# build/icon.icns.
files:
  # Order matters. Without a leading negation, electron-builder's
  # dependency collector packs the whole production dep tree into the asar
  # regardless of this list. '!**/*' first excludes everything, and the
  # positives after it re-include only the shell (app-builder-lib matches
  # each dep file by its destination path, util/filter.js getRelativePath).
  - "!**/*"
  - electron/**/*
  - package.json
  # electron-updater and its runtime dependency tree, re-included past the
  # negation above. Keep in sync when electron-updater bumps (npm ls --all).
  - node_modules/electron-updater/**/*
  - node_modules/fs-extra/**/*
  - node_modules/js-yaml/**/*
  - node_modules/lazy-val/**/*
  - node_modules/lodash.escaperegexp/**/*
  - node_modules/lodash.isequal/**/*
  - node_modules/semver/**/*
  - node_modules/tiny-typed-emitter/**/*
  - node_modules/builder-util-runtime/**/*
  - node_modules/debug/**/*
  - node_modules/sax/**/*
  - node_modules/graceful-fs/**/*
  - node_modules/jsonfile/**/*
  - node_modules/universalify/**/*
  - node_modules/ms/**/*
  - node_modules/argparse/**/*
  - node_modules/jose/**/*
extraResources:
  # Attribution/license for the bounded local Pi cutoff-selector port.
  - from: docs/compaction-accounting.md
    to: licenses/pi-compaction.md
  # Copy from .next, not .next/standalone: electron-builder hard-excludes a
  # copy's root node_modules, and its default pattern drops dot dirs. From
  # .next, the paths start with standalone/ and the explicit wildcard
  # reaches standalone/.next and standalone/node_modules.
  - from: .next
    to: server
    filter:
      - "standalone/**/*"
mac:
  # The backend's --require runs before Next loads. Keep this resource
  # outside app.asar so early Node-mode loading needs no ASAR support.
  extraResources:
    - from: electron/server-title-guard.cjs
      to: server-title-guard.cjs
  icon: build/icon.icon
  # zip only: scripts/install.sh and electron/mac-updater.cjs install from
  # it. Gatekeeper calls an un-notarized app in a quarantined DMG malware.
  target:
    - target: zip
      arch:
        - arm64
  electronLanguages:
    - en
  category: public.app-category.education
  # The TCC mic prompt reads this string; macOS asks regardless of
  # Electron's own handlers.
  extendInfo:
    NSMicrophoneUsageDescription: "Plainly uses the microphone only for speech-to-text input into your sessions."
  # Hardened runtime is off while ad-hoc signed: its library validation
  # rejects Electron's pre-signed frameworks (different Team ID) and the
  # server's native modules. Notarization requires it.
  hardenedRuntime: false
  entitlements: build/entitlements.mac.plist
  # Ad-hoc ("-"): Apple Silicon refuses to run unsigned code. Squirrel.Mac
  # rejects ad-hoc updates, so macOS updates run through
  # electron/mac-updater.cjs.
  identity: "-"
  notarize: false
afterPack: scripts/after-pack.cjs
win:
  icon: build/icon.ico
  target:
    - target: nsis
      arch:
        - x64
  artifactName: "${productName}-${version}-${arch}-setup.${ext}"
  signExecutable: false
  verifyUpdateCodeSignature: false
nsis:
  oneClick: true
  perMachine: false
linux:
  icon: build/icon.png
  target:
    - target: AppImage
      arch:
        - x64
    - target: deb
      arch:
        - x64
  artifactName: "${productName}-${version}-${arch}.${ext}"
  category: Education
  # Match Electron's app_id/WM_CLASS to the installed desktop launcher.
  syncDesktopName: true
publish:
  # electron-updater reads the feed anonymously, so the repo must be
  # public; a token baked into the app would leak.
  - provider: github
    owner: dataguyofprocol
    repo: plainly
    releaseType: draft
